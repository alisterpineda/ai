schema_version: "1.1"
name: target-free-text
tags: [target, quick]
plugins: ["../../..", "../../../../core"]
runs: 1
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Bash, Write, Edit]
  prompt: "/swe:implement add a reverse_words(text) helper to textkit/strings.py that returns the words of text in reverse order, joined by single spaces"
