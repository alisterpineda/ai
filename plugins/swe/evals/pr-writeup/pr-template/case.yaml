schema_version: "1.1"
name: pr-template
tags: [format]
plugins: ["../../..", "../../../../core"]
runs: 1
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  prompt: "Write the PR title and description for this branch."
