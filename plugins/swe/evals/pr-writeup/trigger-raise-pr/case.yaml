schema_version: "1.1"
name: trigger-raise-pr
tags: [trigger]
plugins: ["../../..", "../../../../core"]
runs: 1
context:
  scaffold_script: fixture.sh
  history_file: history.jsonl
execution:
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  prompt: "Looks good. Raise a PR."
