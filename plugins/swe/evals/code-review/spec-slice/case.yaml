schema_version: "1.1"
name: spec-slice
tags: [review, spec]
plugins: ["../../..", "../../../../core"]
runs: 1
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 40
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Bash, Write, Edit]
  prompt: "/swe:code-review --spec docs/rate-limit-spec.md --slice 1 HEAD"
