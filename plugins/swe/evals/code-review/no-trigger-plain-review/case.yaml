schema_version: "1.1"
name: no-trigger-plain-review
tags: [trigger]
plugins: ["../../..", "../../../../core"]
runs: 3
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Bash]
  prompt: "Can you review my last commit for bugs?"
