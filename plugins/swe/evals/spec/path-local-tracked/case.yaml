schema_version: "1.1"
name: path-local-tracked
description: >-
  A resumed design conversation, specced in a repo whose .local/ is tracked,
  not ignored, and has no .scratch/. The spec lands in .scratch/, and nothing
  is written into .local/.
tags: [path]
plugins: ["../../..", "../../../../core"]
runs: 1
context:
  scaffold_script: fixture.sh
  history_file: history.jsonl
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  prompt: "/swe:spec"
