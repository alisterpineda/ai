schema_version: "1.1"
name: update-in-place
description: >-
  A resumed design conversation that already wrote a spec with one open
  question, then settled it. The run updates that file in place: the answer
  joins it, the open question leaves it, the existing decisions keep their
  numbers, and no second spec file is written.
tags: [update]
plugins: ["../../..", "../../../../core"]
runs: 1
context:
  scaffold_script: fixture.sh
  history_file: history.jsonl
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  prompt: "/swe:spec"
