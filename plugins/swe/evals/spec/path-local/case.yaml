schema_version: "1.1"
name: path-local
description: >-
  A resumed design conversation, specced in a repo that has a gitignored .local/
  and no .scratch/. The spec lands in .local/, no .scratch/ is created, and no
  .gitignore is added inside .local/.
tags: [path]
plugins: ["../../..", "../../../../core"]
runs: 1
context:
  scaffold_script: fixture.sh
  history_file: history.jsonl
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  prompt: "/swe:spec"
