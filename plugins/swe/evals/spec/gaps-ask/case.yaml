schema_version: "1.1"
name: gaps-ask
description: >-
  A resumed design conversation that settled a helper but never said what a
  negative n does. The run asks that gap as a numbered question with options
  and a recommendation, and writes no file before the answer.
tags: [gaps]
plugins: ["../../..", "../../../../core"]
runs: 1
context:
  scaffold_script: fixture.sh
  history_file: history.jsonl
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  prompt: "/swe:spec"
