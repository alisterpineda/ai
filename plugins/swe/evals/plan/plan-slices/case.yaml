schema_version: "1.1"
name: plan-slices
tags: [slices]
plugins: ["../../..", "../../../../core"]
runs: 1
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 120
  timeout_seconds: 1800
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Bash, Write, Edit]
  prompt: "/swe:plan docs/specs/top-words-spec.md plan it as two slices: the function first, then the README line"
